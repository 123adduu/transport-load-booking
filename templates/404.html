{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">Return to Dashboard</a>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Edit Load - Transport Load Booking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="fw-bold mb-0 text-warning text-dark">
                    <i class="bi bi-pencil-square me-2 text-warning"></i>Edit Load #{{ load.id }}: {{ load.customer_name }}
                </h5>
            </div>
            <div class="card-body">
                {% if error_message %}
                <div class="alert alert-danger" id="edit_load_error_message">
                    {{ error_message }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('loads.edit', id=load.id) }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="edit_customer_name" class="form-label fw-semibold">Customer Name</label>
                            <input type="text" class="form-control" id="edit_customer_name" name="customer_name" value="{{ load.customer_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_customer_phone" class="form-label fw-semibold">Customer Phone</label>
                            <input type="tel" class="form-control" id="edit_customer_phone" name="customer_phone" value="{{ load.customer_phone }}" maxlength="10" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_pickup_location" class="form-label fw-semibold">Pickup Location</label>
                            <input type="text" class="form-control" id="edit_pickup_location" name="pickup_location" value="{{ load.pickup_location }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edit_destination" class="form-label fw-semibold">Destination</label>
                            <input type="text" class="form-control" id="edit_destination" name="destination" value="{{ load.destination }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_material_type" class="form-label fw-semibold">Material Type</label>
                            <input type="text" class="form-control" id="edit_material_type" name="material_type" value="{{ load.material_type }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_load_weight" class="form-label fw-semibold">Load Weight (Tonnes)</label>
                            <input type="number" step="0.1" class="form-control" id="edit_load_weight" name="load_weight" value="{{ load.load_weight }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_required_vehicle_type" class="form-label fw-semibold">Required Vehicle</label>
                            <select class="form-select" id="edit_required_vehicle_type" name="required_vehicle_type" required>
                                <option value="Truck" {% if load.required_vehicle_type == 'Truck' %}selected{% endif %}>Truck</option>
                                <option value="Mini Truck" {% if load.required_vehicle_type == 'Mini Truck' %}selected{% endif %}>Mini Truck</option>
                                <option value="Trailer" {% if load.required_vehicle_type == 'Trailer' %}selected{% endif %}>Trailer</option>
                                <option value="Pickup" {% if load.required_vehicle_type == 'Pickup' %}selected{% endif %}>Pickup</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_pickup_date" class="form-label fw-semibold">Pickup Date</label>
                            <input type="date" class="form-control" id="edit_pickup_date" name="pickup_date" value="{{ load.pickup_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_offered_price" class="form-label fw-semibold">Offered Price (INR)</label>
                            <input type="number" step="100" class="form-control" id="edit_offered_price" name="offered_price" value="{{ load.offered_price }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_load_status" class="form-label fw-semibold">Load Status</label>
                            <select class="form-select" id="edit_load_status" name="load_status" required>
                                <option value="Posted" {% if load.load_status == 'Posted' %}selected{% endif %}>Posted</option>
                                <option value="Assigned" {% if load.load_status == 'Assigned' %}selected{% endif %}>Assigned</option>
                                <option value="Completed" {% if load.load_status == 'Completed' %}selected{% endif %}>Completed</option>
                                <option value="Cancelled" {% if load.load_status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('loads.list_and_post') }}" class="btn btn-outline-secondary" id="btn_cancel_edit_load">Cancel</a>
                        <button type="submit" class="btn btn-warning text-dark" id="btn_save_load">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

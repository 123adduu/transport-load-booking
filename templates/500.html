{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected server error occurred while processing your request. The transaction has been rolled back safely.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
